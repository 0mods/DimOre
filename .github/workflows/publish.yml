name: Publish mod to platforms
on:
  push:
    branches: [ "stonecutter" ]


jobs:
  changelog:
    name: Generate changelog
    runs-on: ubuntu-latest
    steps:
      - name: checkout repository
        uses: actions/checkout@v5
      - name: Create Release
        uses: ncipollo/release-action@v1.20.0
        with:
          allowUpdates: true
          draft: false
          makeLatest: true
          name: ${{ github.ref_name }}
          token: ${{ github.token }}
          tag: "latest"
          generateReleaseNotes: true
      - name: Generate Changelog
        uses: smichard/conventional_changelog@2.0.0
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Set Git User Info
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Commit Changelog
        run: |
          git add CHANGELOG.md
          git commit -m "docs: :robot: changelog file generated/updated" || echo "No changes to commit"
          git push
  curseforge:
    name: CurseForge Publish
    strategy:
      matrix:
        java: [ 25 ]
        os: [ ubuntu-latest ]
        gradle-version: [ 9.2.1 ]
    runs-on: ${{ matrix.os }}
    if: |
      contains(github.event.head_commit.message, '[cf]')
    needs: changelog
    steps:
      - name: checkout repository
        uses: actions/checkout@v5
      - name: setup jdk ${{ matrix.java }}
        uses: actions/setup-java@v1
        with:
          java-version: ${{ matrix.java }}
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: Prepare Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: ${{ matrix.gradle-version }}
      - name: Build Mod
        run: gradle publishMods
        env:
          CURSEFORGE_ID: ${{ secrets.CURSEFORGE_ID }}
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
  modrinth:
    name: Modrinth Publish
    strategy:
      matrix:
        java: [ 25 ]
        os: [ ubuntu-latest ]
        gradle-version: [ 9.2.1 ]
    runs-on: ${{ matrix.os }}
    if: |
      contains(github.event.head_commit.message, '[mr]')
    needs: changelog
    steps:
      - name: checkout repository
        uses: actions/checkout@v5
      - name: setup jdk ${{ matrix.java }}
        uses: actions/setup-java@v1
        with:
          java-version: ${{ matrix.java }}
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: Prepare Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: ${{ matrix.gradle-version }}
      - name: Build Mod
        run: gradle publishMods
        env:
          MODRINTH_ID: ${{ secrets.CURSEFORGE_ID }}
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
